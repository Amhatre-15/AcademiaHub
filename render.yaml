services:
  # ─── AcademiaHub Backend (API & WebSockets) ──────────────────────────
  - type: web
    name: academiahub-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run db:seed && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: academiahub-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: academiahub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: FRONTEND_URL
        value: https://academiahub-frontend.onrender.com
      - key: SUPABASE_URL
        value: https://placeholder.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: placeholder-service-role-key

  # ─── AcademiaHub Frontend (Vite React SPA) ───────────────────────────
  - type: web
    name: academiahub-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://academiahub-backend-ahzt.onrender.com/api
      - key: VITE_WS_URL
        value: wss://academiahub-backend-ahzt.onrender.com
      - key: VITE_APP_NAME
        value: AcademiaHub

databases:
  # ─── Managed PostgreSQL Database ─────────────────────────────────────
  - name: academiahub-db
    plan: free
    databaseName: academiahub
    postgresMajorVersion: "16"
